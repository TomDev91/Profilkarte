<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=,, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./Swipper/swiper-bundle.min.css">
    <link rel="shortcut icon" href="./Images/icons8-projekt-40.png" type="image/x-icon">

    <title>Profilkarte_TomLi</title>
</head>

<body>
    <!-- Der Header soll umgebaut werden.
     So das, dass Bild neben dem Text steht.-->

    <main>
        <div class="Header">
            <div class="Profil-Foto">
                <img src="./Images/DSC_0018 (2).jpg" alt="mein-Bild">
            </div>
            <section class="vorstellung">
                <h1 class="profil-Name">Tom Lippmann</h1>
                <article class="Beschreibung-Bio">
                    Lorem ipsum dolor sit amet consectetur adipisicing elit. Reiciendis, voluptas.
                </article>
                <article class="Beschreibung-Projekte">
                    Lorem ipsum dolor, sit amet consectetur adipisicing elit. Commodi, similique.
                </article>
            </section>
        </div>
        <div class="Projekte">
            <p>Projekte:</p>
            <!-- Slider main container -->
            <div class="swiper">
                <!-- Additional required wrapper -->
                <div class="swiper-wrapper">
                    <!-- Slides -->
                    <div class="swiper-slide">
                        <a href="#">
                            <img src="./Images/Kaffee.png" alt="Projekt 1" title="Kaffee">
                        </a>
                    </div>
                    <div class="swiper-slide">
                        <a href="#">
                            <img src="./Images/Cappucchino.png" alt="Projekt 1" title="Cappuchino">
                        </a>
                    </div>
                    <div class="swiper-slide">
                        <a href="#">
                            <img src="./Images/CoffeeAutomat.png" alt="Projekt 1" title="Automat">
                        </a>
                    </div>

                </div>
                <!-- If we need pagination -->
                <div class="swiper-pagination"></div>

                <!-- If we need navigation buttons -->
                <div class="swiper-button-prev"></div>
                <div class="swiper-button-next"></div>
            </div>
        </div>
    </main>
    <footer>
        <a href="https://www.instagram.com/tratos91/" title="Instagram" target="_blank"><img
                src="./Images/icons8-instagram-48.png" alt="Instagram"></a>
        <a href="https://github.com/" title="Github Account" target="_blank"><img src="./Images/icons8-github-48.png"
                alt="Github"></a>
    </footer>

    <script src="./Swipper/swiper-bundle.min.js"></script>
    <script src="./Swipper/custom.js"></script>

</body>


</html>
